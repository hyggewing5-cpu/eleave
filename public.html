<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<meta name="robots" content="noindex,nofollow">
<title>สรุปยอดกำลังพลประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#1f4e79;--pri2:#2b6cb0;--ink:#1d2433;--mut:#6b7488;--bg:#f2f5fa;--card:#fff;--line:#e3e7ef;--ok:#16794a;--okbg:#e6f4ec;--warn:#b7791f;--warnbg:#fdf3dc;--sp:#6b46c1;--spbg:#efe9fb}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
.hero{background:linear-gradient(135deg,#1f4e79,#2b6cb0);color:#fff;padding:22px 16px 64px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.hero .wrap{padding:0}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:17px;opacity:.95}
.brand img{height:42px;width:auto;border-radius:8px;background:#fff;padding:2px}
.hero h1{margin:14px 0 2px;font-size:28px;font-weight:700;line-height:1.25}
.date{font-size:19px;opacity:.95}
.asof{display:inline-block;margin-top:10px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;font-size:14px}
main{margin-top:-44px;padding-bottom:30px}
.banner{background:var(--warnbg);color:#7a5200;border:1px solid #f0d9a0;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 2px 10px rgba(20,40,80,.08);border-top:5px solid var(--pri2)}
.kpi .l{color:var(--mut);font-size:14px}
.kpi .n{font-size:40px;font-weight:700;line-height:1.1;margin-top:2px}
.kpi .s{color:var(--mut);font-size:13px;margin-top:2px}
.kpi.ok{border-top-color:var(--ok)}.kpi.ok .n{color:var(--ok)}
.kpi.warn{border-top-color:#d69e2e}.kpi.warn .n{color:var(--warn)}
.kpi.sp{border-top-color:#805ad5}.kpi.sp .n{color:var(--sp)}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin-top:14px;box-shadow:0 1px 6px rgba(20,40,80,.06)}
.card h2{margin:0 0 10px;font-size:18px;font-weight:600}
.card h2 small{color:var(--mut);font-weight:400;font-size:13px}
.stack{display:flex;height:22px;border-radius:999px;overflow:hidden;background:#e8edf4}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:14px;color:var(--mut)}
.legend b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hb{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr auto;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.hb .t{height:12px;background:#e8edf4;border-radius:999px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--pri2);border-radius:999px}
.hb .v{font-weight:600;min-width:42px;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--spbg);border-radius:12px;padding:12px 14px}
.tile .n{font-size:30px;font-weight:700;color:var(--sp);line-height:1.1}
.tile .l{font-size:14px;color:#4a3a7a}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:13px}
tfoot td{font-weight:700;border-bottom:0}
.g{color:var(--ok);font-weight:600}.a{color:var(--warn);font-weight:600}.p{color:var(--sp);font-weight:600}
.names{columns:2;column-gap:24px;font-size:15px;margin:0;padding:0;list-style:none}
.names li{break-inside:avoid;padding:3px 0;border-bottom:1px dashed var(--line)}
.names small{color:var(--mut)}
.note{color:var(--mut);font-size:13px;margin-top:10px}
.state{max-width:520px;margin:12vh auto;text-align:center;padding:28px;background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(20,40,80,.08)}
.state h2{margin:0 0 6px}.state p{color:var(--mut);margin:0}
footer{text-align:center;color:var(--mut);font-size:13px;padding:6px 16px 22px}
body.embed .hero{padding:14px 16px 56px}body.embed .hero h1{font-size:22px}body.embed footer{display:none}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.names{columns:1}.hero h1{font-size:23px}.kpi .n{font-size:34px}}
@media print{.hero{background:#fff;color:#000;padding:0}.asof{background:none;border:1px solid #999}.kpi,.card{box-shadow:none;border:1px solid #ccc}main{margin-top:0}}
</style>
</head>
<body>
<div id="app"><div class="state"><h2>กำลังโหลด…</h2></div></div>
<script src="api-config.js"></script>
<script src="js/public.js"></script>
</body>
</html>
